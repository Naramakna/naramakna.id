services:
  backend:
    build: ./backend
    container_name: naramakna-backend
    ports:
      - "3001:3001"
    restart: always
    env_file:
      - backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./shared:/usr/src/shared:ro
      - ./public/uploads:/usr/src/public/uploads
      - ./public/ads:/usr/src/public/ads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - naramakna-net

  scheduler:
    build: ./backend
    container_name: naramakna-scheduler
    command: ["node", "src/jobs/auto-publish.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    env_file:
      - backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/jobs/scheduler-healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - naramakna-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.naramakna.id/api
        VITE_BACKEND_URL: https://api.naramakna.id/
        VITE_UPLOADS_BASE_URL: https://api.naramakna.id/uploads
        # VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
        # VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3001}
        # VITE_UPLOADS_BASE_URL: ${VITE_UPLOADS_BASE_URL:-http://localhost:3001/uploads}
    container_name: naramakna-frontend
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - frontend/.env
    depends_on:
      - backend
    networks:
      - naramakna-net

  redis:
    image: redis:7-alpine
    container_name: naramakna-redis
    ports:
      - "6379:6379"
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks:
      - naramakna-net

networks:
  naramakna-net:
    driver: bridge

volumes:
  redis-data:
