<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitor - Naramakna.id</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 10px; font-size: 28px; color: #60a5fa; }
        .timestamp { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
        }
        .card-title { font-size: 14px; text-transform: uppercase; color: #94a3b8; margin-bottom: 12px; font-weight: 600; }
        .metric { margin-bottom: 16px; }
        .metric:last-child { margin-bottom: 0; }
        .metric-label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
        .metric-value { font-size: 24px; font-weight: 700; color: #60a5fa; }
        .metric-small { font-size: 18px; }
        .pm2-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .pm2-table th { text-align: left; padding: 8px; font-size: 12px; color: #94a3b8; border-bottom: 1px solid #334155; }
        .pm2-table td { padding: 8px; font-size: 13px; border-bottom: 1px solid #334155; }
        .status-online { color: #10b981; font-weight: 600; }
        .status-stopped { color: #ef4444; font-weight: 600; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .error { background: #7f1d1d; border-color: #991b1b; color: #fca5a5; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Server Monitor</h1>
        <div class="timestamp" id="timestamp">Loading...</div>
        
        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading">Loading server stats...</div>
        <div id="content" style="display: none;">
            <div class="grid">
                <div class="card">                    <div class="card-title">CPU Usage</div>                    <div class="metric">                        <div class="metric-label">Total Used</div>                        <div class="metric-value" id="cpuUsage">-</div>                    </div>                    <div class="metric">                        <div class="metric-label">Idle</div>                        <div class="metric-value metric-small" id="cpuIdle">-</div>                    </div>                </div>
                <div class="card">
                    <div class="card-title">Load Average</div>
                    <div class="metric">
                        <div class="metric-label">1 min</div>
                        <div class="metric-value metric-small" id="load1">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">5 min</div>
                        <div class="metric-value metric-small" id="load5">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">15 min</div>
                        <div class="metric-value metric-small" id="load15">-</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Memory Usage</div>
                    <div class="metric">
                        <div class="metric-label">Used / Total</div>
                        <div class="metric-value metric-small" id="memUsed">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Percentage</div>
                        <div class="metric-value" id="memPercent">-</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Disk Usage</div>
                    <div class="metric">
                        <div class="metric-label">Used / Total</div>
                        <div class="metric-value metric-small" id="diskUsed">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Percentage</div>
                        <div class="metric-value" id="diskPercent">-</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">PM2 Processes</div>
                <table class="pm2-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>CPU</th>
                            <th>Memory</th>
                            <th>Uptime</th>
                            <th>Restarts</th>
                        </tr>
                    </thead>
                    <tbody id="pm2Body">
                        <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch("/api/server-stats");
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById("error").textContent = "Error: " + data.error;
                    document.getElementById("error").style.display = "block";
                    return;
                }

                document.getElementById("error").style.display = "none";
                document.getElementById("loading").style.display = "none";
                document.getElementById("content").style.display = "block";

                // Update timestamp
                document.getElementById("timestamp").textContent = "Last updated: " + new Date(data.timestamp).toLocaleString();

                // Update load average
                // Update CPU                document.getElementById("cpuUsage").textContent = data.cpu.usage;                document.getElementById("cpuIdle").textContent = data.cpu.idle;

                document.getElementById("load1").textContent = data.cpu.loadAverage["1min"];
                document.getElementById("load5").textContent = data.cpu.loadAverage["5min"];
                document.getElementById("load15").textContent = data.cpu.loadAverage["15min"];

                // Update memory
                document.getElementById("memUsed").textContent = data.memory.used + " / " + data.memory.total;
                document.getElementById("memPercent").textContent = data.memory.percent;

                // Update disk
                document.getElementById("diskUsed").textContent = data.disk.used + " / " + data.disk.total;
                document.getElementById("diskPercent").textContent = data.disk.percent;

                // Update PM2 table
                const pm2Body = document.getElementById("pm2Body");
                if (data.pm2.length === 0) {
                    pm2Body.innerHTML = "<tr><td colspan=\"6\" style=\"text-align: center; color: #94a3b8;\">No PM2 processes</td></tr>";
                } else {
                    pm2Body.innerHTML = data.pm2.map(app => `
                        <tr>
                            <td>${app.name}</td>
                            <td class="${app.status === 'online' ? 'status-online' : 'status-stopped'}">${app.status}</td>
                            <td>${app.cpu}</td>
                            <td>${app.memory}</td>
                            <td>${app.uptime}</td>
                            <td>${app.restarts}</td>
                        </tr>
                    `).join("");
                }
            } catch (error) {
                document.getElementById("error").textContent = "Failed to fetch stats: " + error.message;
                document.getElementById("error").style.display = "block";
            }
        }

        // Fetch stats immediately and every 5 seconds
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
