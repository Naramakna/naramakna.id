services:
  backend:
    build: ./backend
    container_name: naramakna-backend
    ports:
      - "3001:3001"
    restart: always
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./shared:/usr/src/shared:ro
      - ./public/uploads:/usr/src/public/uploads
      - ./public/ads:/usr/src/app/public/ads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - naramakna-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3001}
        VITE_UPLOADS_BASE_URL: ${VITE_UPLOADS_BASE_URL:-http://localhost:3001/uploads}
    container_name: naramakna-frontend
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - frontend/.env
    depends_on:
      - backend
    networks:
      - naramakna-net

  redis:
    image: redis:7-alpine
    container_name: naramakna-redis
    ports:
      - "6379:6379"
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks:
      - naramakna-net

networks:
  naramakna-net:
    driver: bridge

volumes:
  redis-data:
