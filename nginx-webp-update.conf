# Tambahkan ini ke nginx config untuk WebP serving dengan fallback

# WebP serving dengan fallback untuk uploads
location /uploads/ {
    alias /var/www/naramakna.id/public/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept";
    
    # Try to serve WebP first if browser supports it
    location ~* ^/uploads/(.+)\.(jpe?g|png)$ {
        add_header Vary "Accept";
        try_files /uploads/$1.webp /uploads/$1.$2;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}